[package]
name = "tuitify"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Personal standalone Spotify terminal player for Windows"
license = "MIT"

[dependencies]
anyhow = "=1.0.100"
base64 = "=0.22.1"
clap = { version = "=4.5.54", features = ["derive"] }
crossterm = { version = "=0.28.1", features = ["event-stream"] }
futures-util = "=0.3.31"
fs2 = "=0.4.3"
httpdate = "=1.0.3"
log = "=0.4.34"
keyring = { version = "=3.6.3", features = ["windows-native"] }
librespot-core = { version = "=0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { version = "=0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
rand = "=0.8.5"
ratatui = "=0.29.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rodio = { version = "=0.20.1", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tempfile = "=3.24.0"
tokio = { version = "=1.49.0", features = ["full"] }
url = "=2.5.8"
webbrowser = "=1.0.6"

[dev-dependencies]
wiremock = "=0.6.5"

[profile.release]
lto = "thin"
strip = "symbols"
